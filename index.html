<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ek minute meri baat sunogi? 🥺</title>
<meta name="theme-color" content="#FFD9E4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&display=swap" rel="stylesheet">

<style>
/* ---------- colour themes (smoothly animated between scenes) ---------- */
@property --a   { syntax: '<color>'; inherits: true; initial-value: #FFD9E4; }
@property --b   { syntax: '<color>'; inherits: true; initial-value: #E3D4FF; }
@property --c   { syntax: '<color>'; inherits: true; initial-value: #FFF6F2; }
@property --ink { syntax: '<color>'; inherits: true; initial-value: #4A2B45; }

:root {
  --serif: 'Fraunces', Georgia, 'Times New Roman', serif;
  --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --rose: #EC6B96;
  --violet: #B58AF0;
  --glass: rgba(255,255,255,.42);
  --glass-edge: rgba(255,255,255,.7);
  --shadow: rgba(120,60,110,.35);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  min-height: 100vh; min-height: 100dvh;
  color: var(--ink);
  font-family: var(--sans);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  background:
    radial-gradient(90% 60% at 12% 0%, var(--a) 0%, transparent 70%),
    radial-gradient(90% 60% at 100% 100%, var(--b) 0%, transparent 70%),
    var(--c);
  background-attachment: fixed;
  transition: --a 1.8s ease, --b 1.8s ease, --c 1.8s ease, --ink 1.2s ease;
}
body[data-theme="dawn"]  { --a:#FFD9E4; --b:#E3D4FF; --c:#FFF6F2; --ink:#4A2B45; }
body[data-theme="calm"]  { --a:#F3E3F5; --b:#FADCE2; --c:#FFF9F6; --ink:#4A2B45; }
body[data-theme="bloom"] { --a:#FFC2D4; --b:#FFE0B8; --c:#FFF3EE; --ink:#5A2742; }
body[data-theme="sky"]   { --a:#CFE3FF; --b:#E8D8FF; --c:#F7FAFF; --ink:#34315E; }
body[data-theme="rose"]  { --a:#FFD1DF; --b:#F3D9FF; --c:#FFF7F8; --ink:#4A2243; }
body[data-theme="dusk"]  { --a:#8E6BB5; --b:#D48AA8; --c:#3A2850; --ink:#FFF3F6;
  --glass: rgba(255,255,255,.12); --glass-edge: rgba(255,255,255,.28); --shadow: rgba(10,0,30,.55); }
body[data-theme="glow"]  { --a:#7B4A8F; --b:#F29CA3; --c:#2B1B3D; --ink:#FFF4F4;
  --glass: rgba(255,255,255,.12); --glass-edge: rgba(255,255,255,.28); --shadow: rgba(10,0,30,.55); }

#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }

/* ---------- stage ---------- */
#stage {
  position: relative; z-index: 2;
  width: min(100%, 560px);
  min-height: 100vh; min-height: 100dvh;
  margin: 0 auto;
  padding: max(34px, env(safe-area-inset-top)) 24px calc(44px + env(safe-area-inset-bottom));
  display: flex; flex-direction: column; justify-content: center;
  text-align: center;
  transition: opacity .7s ease;
}
#stage.leaving { opacity: 0; }
.scene { display: flex; flex-direction: column; gap: 1.35rem; align-items: center; }

/* ---------- text ---------- */
.line {
  margin: 0; max-width: 100%;
  font-family: var(--serif); font-weight: 400;
  font-size: clamp(1.35rem, 5.6vw, 1.75rem);
  line-height: 1.42; letter-spacing: -.005em;
  text-wrap: balance;
  transition: opacity .7s ease, filter .7s ease;
}
.line.big   { font-size: clamp(1.95rem, 8.6vw, 2.7rem); line-height: 1.18; font-style: italic; font-weight: 500; }
.line.soft  { font-family: var(--sans); font-size: 1.12rem; opacity: .85; }
.line.sign  { font-style: italic; font-size: 1.12rem; opacity: .85; }
.line.quote {
  padding: 1.45rem 1.3rem; border-radius: 24px; font-style: italic;
  font-size: clamp(1.5rem, 6.8vw, 2rem); line-height: 1.3;
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px) saturate(1.3); backdrop-filter: blur(18px) saturate(1.3);
  box-shadow: 0 24px 60px -26px var(--shadow);
}
.ln { display: block; }
.w { display: inline-block; white-space: nowrap; }
.ch {
  display: inline-block; opacity: 0; filter: blur(4px); transform: translateY(4px) scale(.96);
  transition: opacity .4s ease, filter .4s ease, transform .5s cubic-bezier(.2,.8,.3,1.3);
}
.ch.on { opacity: 1; filter: none; transform: none; }
.caret {
  display: inline-block; width: 2px; height: 1.05em; margin-left: 2px; vertical-align: -.14em;
  border-radius: 2px; background: var(--rose); box-shadow: 0 0 10px rgba(236,107,150,.8);
  animation: blink 1s steps(1) infinite; transition: opacity .8s ease;
}
.caret.end { opacity: 0 !important; animation: none; }
@keyframes blink { 50% { opacity: 0; } }
@keyframes reveal {
  from { opacity: 0; filter: blur(7px); transform: translateY(6px); }
  to   { opacity: 1; filter: blur(0);   transform: none; }
}
.out { opacity: 0 !important; filter: blur(8px); pointer-events: none; }

/* ---------- buttons ---------- */
.actions { display: flex; flex-direction: column; align-items: center; gap: .8rem; margin-top: .6rem; animation: reveal 1s ease both; transition: opacity .6s ease, filter .6s ease; }
.btn {
  position: relative; overflow: hidden; isolation: isolate;
  appearance: none; border: 0; cursor: pointer;
  min-height: 56px; padding: 16px 30px; max-width: 100%;
  font: 600 1.05rem/1.2 var(--sans); color: #fff; letter-spacing: .01em;
  border-radius: 999px;
  background: linear-gradient(135deg, #F0709B 0%, #C27BE8 100%);
  box-shadow: 0 16px 34px -12px rgba(220,80,140,.7), inset 0 1px 0 rgba(255,255,255,.45);
  transition: transform .25s ease, box-shadow .25s ease, opacity .5s ease;
  -webkit-tap-highlight-color: transparent;
}
.btn::after {
  content: ''; position: absolute; inset: 0; z-index: -1;
  background: linear-gradient(110deg, transparent 30%, rgba(255,255,255,.45) 50%, transparent 70%);
  transform: translateX(-120%); animation: sheen 4.5s ease-in-out 1.5s infinite;
}
@keyframes sheen { 0%, 55% { transform: translateX(-120%); } 100% { transform: translateX(120%); } }
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: scale(.97); }
.btn.gone { opacity: 0; pointer-events: none; }
.btn:focus-visible, .chip:focus-visible, #sound:focus-visible, input[type=range]:focus-visible {
  outline: 3px solid rgba(255,255,255,.95); outline-offset: 3px; box-shadow: 0 0 0 6px rgba(236,107,150,.55);
}
.chip {
  appearance: none; cursor: pointer; padding: 9px 16px; border-radius: 999px;
  font: 500 .9rem var(--sans); color: var(--ink);
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
}

/* ---------- video frame ---------- */
.frame {
  position: relative; margin: 0 auto; width: fit-content; max-width: 100%;
  padding: 8px; border-radius: 28px;
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 30px 70px -24px var(--shadow), 0 0 70px -12px rgba(240,120,160,.38);
  animation: frameIn 1.3s cubic-bezier(.2,.7,.2,1) both;
  transition: opacity .8s ease, transform .8s ease;
}
.frame.out { transform: scale(.96); filter: none; }
.frame.cine { box-shadow: 0 40px 90px -24px rgba(0,0,0,.6), 0 0 110px -10px rgba(255,150,170,.55); }
.frame video {
  display: block; max-width: 100%; max-height: 64vh; max-height: 64dvh;
  width: auto; height: auto; border-radius: 20px; background: #1b1226;
}
@keyframes frameIn { from { opacity: 0; transform: scale(.94); filter: blur(8px); } to { opacity: 1; transform: none; filter: blur(0); } }
.vnote { display: flex; gap: .6rem; justify-content: center; flex-wrap: wrap; min-height: 40px; }
.vnote .chip { animation: reveal .8s ease both; }

/* ---------- gussa meter ---------- */
.meter {
  width: 100%; padding: 1.5rem 1.3rem 1.3rem; border-radius: 26px;
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: 0 24px 60px -26px var(--shadow);
  animation: reveal 1s ease both; transition: opacity .7s ease, filter .7s ease;
}
.meter-face { font-size: 3.2rem; line-height: 1; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
.meter-face.pop { transform: scale(1.18) rotate(-4deg); }
.meter input[type=range] {
  --p: 0%;
  -webkit-appearance: none; appearance: none; width: 100%; height: 34px; margin: 1.1rem 0 .1rem;
  background: transparent; cursor: pointer; touch-action: pan-y;
}
.meter input[type=range]::-webkit-slider-runnable-track {
  height: 10px; border-radius: 999px;
  background: linear-gradient(90deg, #F0709B var(--p), rgba(255,255,255,.55) var(--p));
}
.meter input[type=range]::-moz-range-track { height: 10px; border-radius: 999px; background: rgba(255,255,255,.55); }
.meter input[type=range]::-moz-range-progress { height: 10px; border-radius: 999px; background: #F0709B; }
.meter input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 32px; height: 32px; margin-top: -11px; border-radius: 50%;
  background: #fff; border: 0; box-shadow: 0 6px 16px rgba(120,40,90,.4);
}
.meter input[type=range]::-moz-range-thumb { width: 32px; height: 32px; border-radius: 50%; background: #fff; border: 0; box-shadow: 0 6px 16px rgba(120,40,90,.4); }
.meter-ends { display: flex; justify-content: space-between; font-size: .85rem; opacity: .75; }
.meter-msg { margin: 1rem 0 0; min-height: 3.2em; font-family: var(--serif); font-size: 1.12rem; line-height: 1.4; }

/* ---------- final card ---------- */
.final {
  width: 100%; padding: 2rem 1.4rem; border-radius: 30px;
  display: flex; flex-direction: column; gap: 1.4rem;
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(20px) saturate(1.3); backdrop-filter: blur(20px) saturate(1.3);
  box-shadow: 0 30px 80px -30px var(--shadow);
  animation: frameIn 1.2s cubic-bezier(.2,.7,.2,1) both;
}


/* ---------- yaad hai? (polaroids) ---------- */
.polaroid-stack { position: relative; width: min(74vw, 290px); aspect-ratio: 4 / 5.4; margin: .4rem auto 0; }
.polaroid {
  position: absolute; inset: 0; margin: 0; padding: 12px 12px 56px; cursor: pointer;
  display: flex; flex-direction: column; text-align: left;
  background: #FFFDFB; border-radius: 8px; color: #4A2B45;
  box-shadow: 0 24px 50px -22px rgba(90,30,80,.55), 0 2px 6px rgba(90,30,80,.12);
  transform: rotate(var(--r, 0deg));
  transition: transform .8s cubic-bezier(.3,.8,.3,1), opacity .7s ease;
  animation: dealIn .9s cubic-bezier(.2,.8,.3,1) both;
  -webkit-tap-highlight-color: transparent;
}
.polaroid img { width: 100%; flex: 1; min-height: 0; object-fit: cover; border-radius: 3px; display: block; }
.polaroid figcaption { position: absolute; left: 14px; right: 14px; bottom: 12px; font: italic 400 1.02rem/1.25 var(--serif); }
.polaroid.gone { transform: translate(115%, -12%) rotate(20deg); opacity: 0; pointer-events: none; }
.polaroid:focus-visible { outline: 3px solid var(--rose); outline-offset: 4px; }
@keyframes dealIn { from { opacity: 0; transform: translateY(40px) rotate(var(--r,0deg)) scale(.92); } to { opacity: 1; transform: rotate(var(--r,0deg)); } }

/* ---------- chitthi ---------- */
.env {
  position: relative; width: min(76vw, 300px); aspect-ratio: 3 / 2; margin: .6rem auto 0; cursor: pointer;
  filter: drop-shadow(0 22px 28px rgba(120,50,100,.4));
  animation: bob 3.4s ease-in-out infinite; transition: opacity .8s ease, transform .8s ease;
  -webkit-tap-highlight-color: transparent;
}
.env:focus-visible { outline: 3px solid var(--rose); outline-offset: 6px; border-radius: 12px; }
@keyframes bob { 50% { transform: translateY(-8px); } }
.env > * { position: absolute; left: 0; width: 100%; }
.env-body  { inset: 0; top: 0; height: 100%; border-radius: 10px; background: linear-gradient(160deg, #F7BFD3, #E3A9D6); }
.env-front { top: 0; height: 100%; border-radius: 10px; background: linear-gradient(180deg, #FBD3E1, #F2B8D2);
  clip-path: polygon(0 100%, 0 28%, 50% 64%, 100% 28%, 100% 100%); }
.env-flap  { top: 0; height: 64%; background: linear-gradient(180deg, #E79BC4, #F0AACB);
  clip-path: polygon(0 0, 100% 0, 50% 100%); transform-origin: top center; transition: transform .8s cubic-bezier(.4,.1,.2,1); z-index: 3; }
.env-seal  { top: 52%; left: 50%; width: 42px; height: 42px; margin: -21px 0 0 -21px; z-index: 4; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.2rem; background: radial-gradient(circle at 35% 30%, #F2678F, #C73A6A);
  box-shadow: 0 4px 10px rgba(120,20,60,.5); transition: opacity .4s ease; }
.env.open { animation: none; }
.env.open .env-flap { transform: rotateX(180deg); z-index: 1; }
.env.open .env-seal { opacity: 0; }
.env.out { opacity: 0; transform: translateY(30px) scale(.94); }
.paper {
  width: 100%; padding: 26px 22px 22px; border-radius: 16px; text-align: left;
  background: #FFFDF9; color: #4A2B45; font-size: 1.1rem; line-height: 1.9;
  background-image: repeating-linear-gradient(transparent 0, transparent calc(1.9em - 1px), rgba(236,107,150,.2) calc(1.9em - 1px), rgba(236,107,150,.2) 1.9em);
  background-position: 0 26px;
  box-shadow: 0 30px 70px -26px rgba(90,30,90,.55), 0 0 0 1px rgba(236,107,150,.12);
  animation: frameIn 1.1s cubic-bezier(.2,.7,.2,1) both;
}
.paper .line { font-size: inherit; line-height: inherit; text-align: left; text-wrap: pretty; margin: 0 0 1.9em; }
.paper .line.sign { text-align: right; font-style: italic; margin-bottom: 0; opacity: 1; }
.paper .caret { background: var(--rose); }

/* ---------- mujhe sunao ---------- */
.listen { width: 100%; display: flex; flex-direction: column; gap: .9rem; transition: opacity 1.2s ease, filter 1.2s ease, transform 1.2s ease; animation: reveal 1s ease both; }
.listen.dissolve { opacity: 0; filter: blur(14px); transform: translateY(-26px) scale(.97); }
.listen textarea {
  width: 100%; min-height: 150px; resize: none; padding: 16px 16px; border-radius: 22px;
  font: 400 16px/1.55 var(--sans); color: var(--ink);
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  box-shadow: 0 20px 50px -26px var(--shadow);
}
.listen textarea::placeholder { color: var(--ink); opacity: .5; }
.listen textarea:focus { outline: 3px solid rgba(236,107,150,.55); outline-offset: 2px; }
.listen .priv { margin: 0; font-size: .88rem; opacity: .75; }
.listen .row { display: flex; flex-direction: column; align-items: center; gap: .7rem; }
.btn:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }

/* ---------- all the best card ---------- */
.luck { width: 100%; perspective: 1400px; }
.luck-card { position: relative; width: 100%; min-height: 370px; cursor: pointer; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.2,.8,.2,1); -webkit-tap-highlight-color: transparent; }
.luck-card.flipped { transform: rotateY(180deg); }
.luck-card:focus-visible { outline: 3px solid var(--rose); outline-offset: 6px; border-radius: 30px; }
.luck .face {
  position: absolute; inset: 0; padding: 1.6rem 1.4rem; border-radius: 30px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
  backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px);
  box-shadow: 0 30px 80px -30px var(--shadow);
}
.luck .front { background: linear-gradient(155deg, rgba(255,255,255,.7), rgba(255,214,230,.55)); }
.luck .back { transform: rotateY(180deg); text-align: left; align-items: stretch; justify-content: center; }
.luck .front .line { font-size: clamp(1.9rem, 8vw, 2.5rem); font-style: italic; font-weight: 500; line-height: 1.2; }
.luck .tap { font-size: .95rem; opacity: .7; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.luck ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: .85rem; font-family: var(--serif); font-size: 1.08rem; line-height: 1.4; }
.luck li::before { content: '🌸'; margin-right: .55rem; }
.luck .count { align-self: center; padding: 9px 16px; border-radius: 999px; font: 600 .95rem var(--sans); background: rgba(236,107,150,.16); }

/* ---------- sound toggle ---------- */
#sound {
  position: fixed; z-index: 30;
  top: max(12px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right));
  width: 44px; height: 44px; border-radius: 50%; padding: 0; cursor: pointer;
  display: grid; place-items: center; color: var(--ink);
  background: var(--glass); border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  opacity: 0; pointer-events: none; transition: opacity 1s ease;
}
#sound.show { opacity: 1; pointer-events: auto; }
#sound svg { width: 22px; height: 22px; }
#sound .off { display: none; }
#sound[aria-pressed="false"] .on { display: none; }
#sound[aria-pressed="false"] .off { display: block; }

/* ---------- entrance gate ---------- */
#gate {
  position: fixed; inset: 0; z-index: 40; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 1.1rem;
  padding: 0 24px calc(15vh + env(safe-area-inset-bottom));
  background: linear-gradient(160deg, #3A2850 0%, #8E4F86 55%, #E58AA6 100%);
  transition: opacity 1.1s ease;
}
#gate.open { opacity: 0; pointer-events: none; }
#gate video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#gate .veil { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(40,15,50,.25) 0%, rgba(40,15,50,.15) 40%, rgba(40,15,50,.65) 100%); }
#gate p { position: relative; margin: 0; color: rgba(255,255,255,.9); font-family: var(--serif); font-style: italic; font-size: 1.05rem; text-shadow: 0 2px 14px rgba(0,0,0,.4); }
.enter {
  position: relative; appearance: none; cursor: pointer;
  min-height: 62px; padding: 18px 46px; border-radius: 999px;
  font: 600 1.15rem/1 var(--sans); letter-spacing: .02em; color: #fff;
  background: rgba(255,255,255,.2); border: 1px solid rgba(255,255,255,.65);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  box-shadow: 0 18px 44px -14px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.5);
  transition: transform .25s ease; -webkit-tap-highlight-color: transparent;
}
.enter:active { transform: scale(.96); }
.enter::before, .enter::after {
  content: ''; position: absolute; inset: -1px; border-radius: inherit;
  border: 1.5px solid rgba(255,255,255,.75); opacity: 0; animation: ring 3s ease-out infinite;
}
.enter::after { animation-delay: 1.5s; }
@keyframes ring { 0% { transform: scale(1); opacity: .75; } 100% { transform: scale(1.5, 1.9); opacity: 0; } }
.enter:focus-visible { outline: 3px solid #fff; outline-offset: 4px; }

noscript { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; padding: 2rem; text-align: center; background: #fff6f2; font: 1.2rem var(--serif); color: #4a2b45; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .btn::after, .enter::before, .enter::after { display: none; }
}
</style>
</head>

<body data-theme="dawn">
<noscript>Ye chhoti si website JavaScript ke bina nahi chalegi 🥺 Please JavaScript on karke dobara kholo.</noscript>

<canvas id="fx" aria-hidden="true"></canvas>

<!-- Entrance: animated Enter button over the intro video -->
<div id="gate">
  <video id="introVid" muted loop playsinline preload="auto" aria-hidden="true"></video>
  <div class="veil"></div>
  <p>Sound on rakhna 🎧</p>
  <button id="enter" class="enter" type="button">💗 Enter</button>
</div>

<button id="sound" type="button" aria-pressed="true" aria-label="Music on ya off karo">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>
</button>

<main id="stage" aria-live="polite"></main>

<!-- =====================================================================
     YAHAN SE BADLO: naam, messages, video ke naam, final message
     ===================================================================== -->
<script>
const CONFIG = {
  nick:  "Madam Ji",
  cute:  "Butkii",
  name:  "Rashi",

  music: { src: "music/song.mp3", volume: 0.55 },

  // Typing effect (milliseconds). Screen tap karne par line turant poori ho jati hai.
  typing: { speed: 46, pauseComma: 170, pausePunct: 420, lineBreak: 560 },

  // videos/ folder mein ye files rakhna. Koi file missing ho to us scene ka video chup-chaap skip ho jata hai.

<script>
(() => {
  'use strict';
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const $ = (s, r = document) => r.querySelector(s);
  const stage = $('#stage');
  const sleep = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 150) : ms));
  const fmt = t => String(t).replace(/\{nick\}/g, CONFIG.nick).replace(/\{cute\}/g, CONFIG.cute).replace(/\{name\}/g, CONFIG.name);
  const h = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const follow = el => setTimeout(() => el.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' }), 120);

  /* ============================ MUSIC ============================ */
  const music = new Audio();
  music.src = CONFIG.music.src; music.loop = true; music.preload = 'auto'; music.volume = 0;
  const soundBtn = $('#sound');
  let wantMusic = true, musicOk = true, ducked = false, musicBegun = false, fadeTimer = null;
  music.addEventListener('error', () => { musicOk = false; soundBtn.hidden = true; });

  function fade(to, ms, done) {
    clearInterval(fadeTimer);
    const from = music.volume, t0 = performance.now();
    fadeTimer = setInterval(() => {
      const k = Math.min(1, (performance.now() - t0) / ms);
      try { music.volume = from + (to - from) * k; } catch (e) {}
      if (k >= 1) { clearInterval(fadeTimer); if (done) done(); }
    }, 50);
  }
  function musicStart() {
    if (!musicOk || !wantMusic) return;
    const p = music.play();
    if (p && p.then) p.then(() => { musicBegun = true; fade(CONFIG.music.volume, 2800); }).catch(() => {});
  }
  function musicDuck() { ducked = true; fade(0, 600, () => { if (ducked) music.pause(); }); }
  function musicUnduck() {
    ducked = false;
    if (!wantMusic || !musicOk || !musicBegun) return;
    const p = music.play();
    if (p && p.then) p.then(() => fade(CONFIG.music.volume, 2000)).catch(() => {});
  }
  soundBtn.addEventListener('click', () => {
    wantMusic = !wantMusic;
    soundBtn.setAttribute('aria-pressed', String(wantMusic));
    if (!wantMusic) fade(0, 300, () => music.pause());
    else if (!ducked) { musicBegun ? musicUnduck() : musicStart(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) music.pause();
    else if (wantMusic && !ducked && musicBegun) { const p = music.play(); if (p && p.catch) p.catch(() => {}); }
  });

  /* ============================ VIDEOS ============================ */
  const pool = {};
  function getVideo(key) {
    if (pool[key]) return pool[key];
    const src = CONFIG.videos[key]; if (!src) return null;
    const v = document.createElement('video');
    v.setAttribute('playsinline', ''); v.setAttribute('webkit-playsinline', '');
    v.playsInline = true; v.preload = 'auto'; v.controls = true;
    v.disablePictureInPicture = true;
    v.setAttribute('controlslist', 'nodownload noremoteplayback');
    v.addEventListener('error', () => { v._failed = true; });
    v.src = src;
    pool[key] = v; return v;
  }
  // Enter-tap ke andar har video ko "unlock" karte hain, taaki baad mein video apne aap sound ke saath chal sake (iPhone ke liye zaroori)
  function unlockVideos() {
    Object.keys(CONFIG.videos).forEach(k => {
      if (k === 'intro') return;
      const v = getVideo(k); if (!v) return;
      v.muted = true;
      const p = v.play();
      if (p && p.then) p.then(() => { if (!v._used) { v.pause(); try { v.currentTime = 0; } catch (e) {} } }).catch(() => {});
    });
  }

  async function stepVideo(st, root) {
    const el = getVideo(st.key);
    if (!el || el._failed || el.error) return;               // file missing: chup-chaap skip
    el._used = true;
    try { el.currentTime = 0; } catch (e) {}
    el.loop = false; el.muted = false; el.controls = true;

    const frame = h('figure', 'frame ' + (st.cls || ''));
    frame.append(el);
    const note = h('div', 'vnote');
    root.append(frame, note); follow(frame);

    let finish; let finished = false;
    const done = new Promise(res => { finish = () => { if (!finished) { finished = true; res(); } }; });
    el.addEventListener('ended', finish, { once: true });
    el.addEventListener('error', finish, { once: true });

    musicDuck();
    await sleep(500);

    let started = false;
    try { await el.play(); started = true; }
    catch (e) {
      try {
        el.muted = true; await el.play(); started = true;
        const chip = h('button', 'chip', '🔊 Sound on karo'); chip.type = 'button';
        chip.addEventListener('click', () => { el.muted = false; chip.remove(); });
        note.append(chip);
      } catch (e2) { /* controls se wo khud play kar sakti hai */ }
    }

    setTimeout(() => {
      if (finished) return;
      const skip = h('button', 'chip', 'Aage badho'); skip.type = 'button';
      skip.addEventListener('click', () => { el.pause(); finish(); });
      note.append(skip);
    }, started ? 5000 : 3000);

    await done;
    el.pause();
    musicUnduck();
    await sleep(700);
    frame.classList.add('out'); note.remove();
    await sleep(900);
    frame.remove();
  }

  /* ============================ STEPS ============================ */
  /* ---------- typewriter ---------- */
  const seg = (typeof Intl !== 'undefined' && Intl.Segmenter) ? new Intl.Segmenter(undefined, { granularity: 'grapheme' }) : null;
  const graphemes = s => seg ? Array.from(seg.segment(s), x => x.segment) : Array.from(s);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let fastTap = false;                       // screen tap = is line ko turant poora dikha do
  addEventListener('pointerdown', () => { fastTap = true; }, { passive: true });

  async function typeInto(p, text, speedOverride) {
    const T = CONFIG.typing, speed = speedOverride || T.speed;
    fastTap = false;
    const seq = [];
    text.split('\n').forEach(line => {
      const ln = h('span', 'ln');
      const words = line.split(' ');
      words.forEach((word, wi) => {
        const w = h('span', 'w');
        graphemes(word).forEach(g => { const s = h('span', 'ch', g); w.append(s); seq.push({ el: s, g }); });
        ln.append(w);
        if (wi < words.length - 1) ln.append(document.createTextNode(' '));
      });
      p.append(ln); seq.push({ brk: true });
    });
    const caret = h('span', 'caret');
    p.querySelector('.ch')?.before(caret);
    for (const c of seq) {
      if (c.brk) { if (!reduce && !fastTap) await wait(T.lineBreak); continue; }
      c.el.classList.add('on'); c.el.after(caret);
      if (reduce || fastTap) continue;
      let d = speed * (0.7 + Math.random() * 0.6);
      if ('.…!?'.includes(c.g)) d += T.pausePunct;
      else if (',;:—'.includes(c.g)) d += T.pauseComma;
      await wait(d);
    }
    caret.classList.add('end'); setTimeout(() => caret.remove(), 900);
    await wait(reduce ? 0 : 450);              // aakhri letters ki fade poori ho jaye
  }

  async function stepLine(st, root) {
    const p = h('p', 'line ' + (st.cls || ''));
    root.append(p); follow(p);
    await typeInto(p, fmt(st.text), st.speed);
    await sleep(st.hold ?? 900);
  }

  async function stepClear(root) {
    const kids = [...root.children];
    kids.forEach(k => k.classList.add('out'));
    await sleep(750);
    kids.forEach(k => k.remove());
    window.scrollTo(0, 0);
  }

  function waitButton(label, root) {
    return new Promise(res => {
      const wrap = h('div', 'actions');
      const b = h('button', 'btn', fmt(label)); b.type = 'button';
      b.addEventListener('click', () => {
        b.disabled = true; wrap.classList.add('out');
        setTimeout(() => wrap.remove(), 650);
        res();
      }, { once: true });
      wrap.append(b); root.append(wrap); follow(wrap);
    });
  }

  async function stepMeter(st, root) {
    const M = CONFIG.meter;
    const box = h('div', 'meter');
    const face = h('div', 'meter-face', '😤'); face.setAttribute('aria-hidden', 'true');
    const input = h('input'); input.type = 'range'; input.min = 0; input.max = 100; input.value = 0;
    input.setAttribute('aria-label', 'Gussa kitna hai');
    const ends = h('div', 'meter-ends'); ends.append(h('span', '', 'Gussa 😤'), h('span', '', 'Thoda kam 🥺'));
    const msg = h('p', 'meter-msg', fmt(M.start)); msg.style.whiteSpace = 'pre-line'; msg.setAttribute('aria-live', 'polite');
    box.append(face, input, ends, msg);
    root.append(box); follow(box);

    let last = null, sparked = false;
    const update = () => {
      const v = +input.value;
      input.style.setProperty('--p', v + '%');
      const s = M.steps.find(x => v <= x.upto) || M.steps[M.steps.length - 1];
      if (s !== last) {
        last = s; face.textContent = s.face; msg.textContent = fmt(s.text);
        face.classList.add('pop'); setTimeout(() => face.classList.remove('pop'), 280);
      }
      if (v >= 96 && !sparked) {
        sparked = true;
        const r = face.getBoundingClientRect();
        burst(r.left + r.width / 2, r.top + r.height / 2, 14);
      }
    };
    input.addEventListener('input', update);
    update(); msg.textContent = fmt(M.start); last = null;
    await sleep(600);
  }

  async function stepFinale(st, root) {
    const wrap = h('div', 'actions');
    const b = h('button', 'btn', fmt(st.label)); b.type = 'button';
    wrap.append(b); root.append(wrap); follow(wrap);
    await new Promise(res => b.addEventListener('click', res, { once: true }));

    const r = b.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 70);
    setTimeout(() => burst(innerWidth * .2, innerHeight * .78, 26), 260);
    setTimeout(() => burst(innerWidth * .8, innerHeight * .78, 26), 480);

    [...root.children].forEach(k => k.classList.add('out'));
    await sleep(1100);
    root.replaceChildren(); window.scrollTo(0, 0);

    const card = h('div', 'final'); root.append(card);
    for (const m of CONFIG.finalMessage) {
      const p = h('p', 'line ' + (m.cls || ''));
      card.append(p); follow(p);
      await typeInto(p, fmt(m.text), m.speed);
      await sleep(900);
    }
  }


  /* ---------- yaad hai? ---------- */
  async function stepMemories(st, root) {
    const list = CONFIG.memories || [];
    const loaded = await Promise.all(list.map(m => new Promise(res => {
      const im = new Image(); im.onload = () => res(m); im.onerror = () => res(null); im.src = m.photo;
    })));
    const ok = loaded.filter(Boolean);
    if (!ok.length) return 'skip';

    await stepLine({ text: CONFIG.memoriesLead, cls: 'big', speed: 70, hold: 400 }, root);
    const stack = h('div', 'polaroid-stack'); root.append(stack); follow(stack);
    const tilts = [-3, 2.5, -1.5, 3, -2];
    let cur = 0;
    const hint = ok.length > 1 ? h('p', 'line soft', 'Tap karke aage dekho 🤍') : null;
    if (hint) root.append(hint);

    await new Promise(res => {
      const figs = ok.map((m, i) => {
        const f = h('figure', 'polaroid');
        f.style.setProperty('--r', tilts[i % tilts.length] + 'deg');
        f.style.zIndex = String(ok.length - i);
        f.style.animationDelay = (i * 120) + 'ms';
        f.tabIndex = 0; f.setAttribute('role', 'button'); f.setAttribute('aria-label', 'Agli photo dekho');
        const im = h('img'); im.src = m.photo; im.alt = ''; im.draggable = false;
        f.append(im);
        if (m.caption) f.append(h('figcaption', '', fmt(m.caption)));
        const flip = () => {
          if (i !== cur) return;
          f.classList.add('gone'); cur++;
          if (cur >= ok.length) res();
        };
        f.addEventListener('click', flip);
        f.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
        stack.append(f); return f;
      });
    });
    if (hint) hint.classList.add('out');
    await sleep(900);
    stack.remove(); if (hint) hint.remove();
    await stepLine({ text: CONFIG.memoriesEnd, hold: 700 }, root);
  }

  /* ---------- mujhe sunao ---------- */
  async function stepListen(st, root) {
    const Lc = CONFIG.listen;
    const box = h('div', 'listen');
    const ta = h('textarea'); ta.rows = 5; ta.maxLength = 1500;
    ta.placeholder = Lc.placeholder; ta.setAttribute('aria-label', 'Aaj kya hua tha');
    ta.autocomplete = 'off'; ta.spellcheck = false;
    const priv = h('p', 'priv', Lc.privacy);
    const row = h('div', 'row');
    const send = h('button', 'btn', Lc.send); send.type = 'button'; send.disabled = true;
    const skip = h('button', 'chip', Lc.skip); skip.type = 'button';
    row.append(send, skip);
    box.append(ta, priv, row);
    root.append(box); follow(box);
    ta.addEventListener('input', () => { send.disabled = !ta.value.trim(); });

    const choice = await new Promise(res => {
      send.addEventListener('click', () => res('send'), { once: true });
      skip.addEventListener('click', () => res('skip'), { once: true });
    });

    if (choice === 'send') {
      const r = ta.getBoundingClientRect();
      ta.value = '';                                   // kahin save nahi hota, bas gayab
      burst(r.left + r.width / 2, r.top + r.height / 2, 26);
      box.classList.add('dissolve');
      await sleep(1300); box.remove();
      await stepLine({ text: Lc.done, hold: 900 }, root);
      await stepLine({ text: Lc.done2, hold: 1200 }, root);
    } else {
      ta.value = '';
      box.classList.add('dissolve');
      await sleep(900); box.remove();
      await stepLine({ text: Lc.skipped, hold: 1200 }, root);
    }
  }

  /* ---------- all the best card ---------- */
  async function stepLuck(st, root) {
    const L = CONFIG.luck;
    const wrap = h('div', 'luck');
    const card = h('div', 'luck-card'); card.tabIndex = 0; card.setAttribute('role', 'button'); card.setAttribute('aria-label', 'All the best card palto');
    const front = h('div', 'face front');
    const fl = h('p', 'line'); fl.style.whiteSpace = 'pre-line'; fl.textContent = fmt(L.front);
    front.append(fl, h('div', 'tap', L.hint));
    const back = h('div', 'face back');
    const ul = h('ul');
    L.notes.forEach(n => ul.append(h('li', '', fmt(n))));
    back.append(ul);
    if (L.examDate) {
      const days = Math.ceil((new Date(L.examDate + 'T00:00:00') - new Date()) / 86400000);
      if (days > 0) back.append(h('div', 'count', 'Next exam mein ' + days + ' din baaki. Tum tayyar ho 💪'));
      else if (days === 0) back.append(h('div', 'count', 'Exam aaj hai. All the best 🌸'));
    }
    card.append(front, back); wrap.append(card); root.append(wrap); follow(wrap);
    await new Promise(res => {
      const flip = () => { card.classList.toggle('flipped'); res(); };
      card.addEventListener('click', flip);
      card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); flip(); } });
      setTimeout(res, 15000);                         // wo na bhi palte to aage ka button aa jaye
    });
    await sleep(2200);
  }

  /* ---------- chitthi ---------- */
  let voiceEl = null;
  function probeVoice() {
    if (!CONFIG.voice) return;
    const a = new Audio(); a.preload = 'metadata';
    a.addEventListener('loadedmetadata', () => { voiceEl = a; }, { once: true });
    a.src = CONFIG.voice;
  }
  async function stepLetter(st, root) {
    const Lt = CONFIG.letter;
    const env = h('div', 'env'); env.tabIndex = 0; env.setAttribute('role', 'button'); env.setAttribute('aria-label', 'Chitthi kholo');
    ['env-body', 'env-front', 'env-flap', 'env-seal'].forEach(c => env.append(h('div', c, c === 'env-seal' ? '❤️' : '')));
    const hint = h('p', 'line soft', 'Khol ke dekho 🤍');
    root.append(env, hint); follow(env);
    await new Promise(res => {
      const open = () => res();
      env.addEventListener('click', open, { once: true });
      env.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } }, { once: true });
    });
    env.classList.add('open'); hint.classList.add('out');
    await sleep(1000);
    env.classList.add('out');
    await sleep(800);
    env.remove(); hint.remove();

    const paper = h('div', 'paper'); root.append(paper); follow(paper);
    await sleep(600);
    for (const para of Lt.paragraphs) {
      const p = h('p', 'line'); paper.append(p); follow(p);
      await typeInto(p, fmt(para), Lt.speed);
      await sleep(350);
    }
    const sg = h('p', 'line sign'); paper.append(sg); follow(sg);
    await typeInto(sg, fmt(Lt.sign), Lt.speed);
    await sleep(600);

    if (voiceEl) {
      const note = h('div', 'vnote'); root.append(note);
      const chip = h('button', 'chip', '🎙️ Ek voice note bhi hai, sun lo'); chip.type = 'button';
      let playing = false;
      voiceEl.addEventListener('ended', () => { playing = false; chip.textContent = '🎙️ Dobara sunna hai?'; musicUnduck(); });
      chip.addEventListener('click', () => {
        if (!playing) { musicDuck(); voiceEl.currentTime = 0; voiceEl.play().then(() => { playing = true; chip.textContent = '⏸ Rok do'; }).catch(() => musicUnduck()); }
        else { voiceEl.pause(); playing = false; chip.textContent = '🎙️ Phir se sunna hai?'; musicUnduck(); }
      });
      note.append(chip); follow(note);
      await sleep(500);
    }
  }

  async function runStep(st, root) {
    switch (st.t) {
      case 'line':   return stepLine(st, root);
      case 'pause':  return sleep(st.ms);
      case 'clear':  return stepClear(root);
      case 'button':
      case 'next':   return waitButton(st.label, root);
      case 'video':  return stepVideo(st, root);
      case 'meter':  return stepMeter(st, root);
      case 'finale': return stepFinale(st, root);
      case 'memories': return stepMemories(st, root);
      case 'listen': return stepListen(st, root);
      case 'luckcard': return stepLuck(st, root);
      case 'letter': return stepLetter(st, root);
    }
  }

  async function runScenes() {
    const S = CONFIG.scenes;
    for (let i = 0; i < S.length; i++) {
      document.body.dataset.theme = S[i].theme;
      const root = h('section', 'scene'); stage.append(root);
      window.scrollTo(0, 0);
      let skipped = false;
      for (const st of S[i].steps) { const r = await runStep(st, root); if (r === 'skip') { skipped = true; break; } }
      if (skipped) { root.remove(); continue; }
      if (i === S.length - 1) break;
      if (S[i + 1]) document.body.dataset.theme = S[i + 1].theme;
      stage.classList.add('leaving');
      await sleep(800);
      stage.replaceChildren();
      stage.classList.remove('leaving');
    }
  }

  /* ============================ PARTICLES ============================ */
  const fx = $('#fx'), c = fx.getContext('2d');
  let W = 0, H = 0, D = 1;
  function size() { D = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight; fx.width = W * D; fx.height = H * D; c.setTransform(D, 0, 0, D, 0, 0); }
  addEventListener('resize', size); size();
  const PAL = { light: ['#F07AA0', '#C79BF2', '#FFB7CB'], dark: ['#FFB3CB', '#E6D2FF', '#FFD6E2'] };
  const palette = () => PAL[/^(dusk|glow)$/.test(document.body.dataset.theme) ? 'dark' : 'light'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];

  function heart(x, y, s, rot, color, alpha, glow) {
    c.save(); c.translate(x, y); c.rotate(rot); c.scale(s / 14, s / 14);
    c.globalAlpha = alpha; c.fillStyle = color;
    if (glow) { c.shadowColor = color; c.shadowBlur = glow; }
    c.beginPath(); c.moveTo(0, 6);
    c.bezierCurveTo(-14, -3, -7, -14, 0, -6);
    c.bezierCurveTo(7, -14, 14, -3, 0, 6);
    c.fill(); c.restore();
  }

  const floaters = [];
  const FN = reduce ? 5 : (W < 500 ? 11 : 18);
  const mkFloater = init => ({ x: rand(0, W), y: init ? rand(0, H) : H + 30, s: rand(8, 18), vy: rand(.12, .34), sw: rand(0, 6.28), sp: rand(.004, .012), a: rand(.14, .34), ci: (Math.random() * 3) | 0 });
  for (let i = 0; i < FN; i++) floaters.push(mkFloater(true));
  const bursts = [];

  function burst(x, y, n) {
    const count = reduce ? Math.ceil(n / 3) : n, pal = palette();
    for (let i = 0; i < count; i++) {
      const ang = rand(0, 6.28), sp = rand(2, 7.5);
      bursts.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - rand(1, 3.5), s: rand(7, 16), rot: rand(0, 6.28), vr: rand(-.08, .08), color: pick(pal), life: 1, decay: rand(.006, .014), dot: Math.random() < .3 });
    }
  }

  let lastT = performance.now();
  function frame(t) {
    const dt = Math.min(2.5, (t - lastT) / 16.67); lastT = t;
    c.clearRect(0, 0, W, H);
    if (!document.hidden) {
      const pal = palette();
      for (const f of floaters) {
        f.y -= f.vy * dt * (reduce ? .3 : 1); f.sw += f.sp * dt;
        const x = f.x + Math.sin(f.sw) * 18;
        if (f.y < -30) Object.assign(f, mkFloater(false));
        heart(x, f.y, f.s, Math.sin(f.sw) * .4, pal[f.ci], f.a, 10);
      }
      for (let i = bursts.length - 1; i >= 0; i--) {
        const p = bursts[i];
        p.vy += .09 * dt; p.vx *= .992; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= p.decay * dt;
        if (p.life <= 0 || p.y > H + 40) { bursts.splice(i, 1); continue; }
        if (p.dot) { c.globalAlpha = p.life * .9; c.fillStyle = p.color; c.beginPath(); c.arc(p.x, p.y, p.s / 5, 0, 6.28); c.fill(); }
        else heart(p.x, p.y, p.s, p.rot, p.color, Math.min(1, p.life * 1.2), 0);
      }
      c.globalAlpha = 1;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ============================ ENTER ============================ */
  const gate = $('#gate'), intro = $('#introVid');
  const introSrc = CONFIG.videos.intro;
  if (introSrc) {
    intro.addEventListener('error', () => { intro.hidden = true; });
    intro.src = introSrc;
    const p = intro.play(); if (p && p.catch) p.catch(() => {});
  } else intro.hidden = true;

  $('#enter').addEventListener('click', async () => {
    // Ye sab user ke tap ke andar hona zaroori hai (browser rule)
    musicStart();
    unlockVideos();
    probeVoice();
    soundBtn.classList.add('show');
    gate.classList.add('open');
    await sleep(700);
    runScenes();
    await sleep(600);
    intro.pause(); gate.remove();
  }, { once: true });
})();
</script>
